# =============================================================================
# Elos ESG API - Pipeline CI/CD (GitHub Actions)
#
#   push na main ou execução manual:
#     build + testes -> imagem Docker (GHCR) -> deploy STAGING -> smoke test
#       -> aprovação manual -> deploy PRODUÇÃO -> smoke test
#
#   pull request para a main:
#     build + testes -> build da imagem (sem publicar e sem deploy)
# =============================================================================
name: CI/CD - Elos ESG API

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ---------------------------------------------------------------------------
  # 1) CI: restore, build e testes automatizados (xUnit)
  # ---------------------------------------------------------------------------
  build-test:
    name: Build e testes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Kaizen.sln

      - name: Build (Release)
        run: dotnet build Kaizen.sln -c Release --no-restore

      - name: Testes (xUnit)
        run: |
          set -o pipefail
          dotnet test Kaizen.sln -c Release --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --logger "console;verbosity=normal" \
            --results-directory TestResults | tee test-output.txt

      - name: Resumo dos testes
        if: always()
        run: |
          {
            echo "### Resultado dos testes xUnit"
            echo '```'
            grep -E "(Passed!|Failed!|Aprovado!|Com falha!|Total)" test-output.txt || echo "ver log do passo de testes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatório de testes (artefato)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2) Imagem Docker: build e push para o GitHub Container Registry
  # ---------------------------------------------------------------------------
  docker:
    name: Imagem Docker (build e push)
    runs-on: ubuntu-latest
    needs: build-test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.vars.outputs.image }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Definir nome da imagem e versão
        id: vars
        run: |
          REPO_LOWER="${GITHUB_REPOSITORY,,}"
          SHORT_SHA="${GITHUB_SHA::7}"
          {
            echo "image=ghcr.io/${REPO_LOWER}:sha-${SHORT_SHA}"
            echo "latest=ghcr.io/${REPO_LOWER}:latest"
            echo "version=${SHORT_SHA}"
          } >> "$GITHUB_OUTPUT"

      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet
          rm .env
          echo "docker-compose.yml válido"

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: final
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            APP_VERSION=${{ steps.vars.outputs.version }}
          tags: |
            ${{ steps.vars.outputs.image }}
            ${{ steps.vars.outputs.latest }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumo da imagem
        run: |
          {
            echo "### Imagem Docker"
            echo "- Imagem: \`${{ steps.vars.outputs.image }}\`"
            echo "- Publicada: ${{ github.event_name != 'pull_request' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 3) CD: deploy automático em STAGING
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy Staging
    needs: docker
    # só faz deploy fora de PR e depois que a VM foi configurada (variable VM_HOST)
    if: github.event_name != 'pull_request' && vars.VM_HOST != ''
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      api_port: "8081"
      image: ${{ needs.docker.outputs.image }}
      version: ${{ needs.docker.outputs.version }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # 4) CD: deploy em PRODUÇÃO (só depois de staging OK + aprovação manual,
  #    configurada no environment "production" do GitHub)
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy Produção
    needs: [docker, deploy-staging]
    if: github.event_name != 'pull_request' && vars.VM_HOST != ''
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      api_port: "8080"
      image: ${{ needs.docker.outputs.image }}
      version: ${{ needs.docker.outputs.version }}
    secrets: inherit
